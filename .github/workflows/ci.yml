name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  cts:
    name: CTS and safety checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Run repository safety checks
        run: npm run precommit:check

      - name: Check v2 CTS proposal lane scaffold
        run: npm run check:cts-v2-lane

      - name: Run v2 proposal CTS slice
        run: npm run cts:run:v2:proposal

      - name: Run reference parser CTS
        run: npm run cts:run:reference

      - name: Run subset adapter CTS
        run: npm run cts:run:subset

      - name: Run baseline adapter example CTS
        run: npm run cts:run:example

      - name: Check canonical emitter
        run: npm run check:canonical-emitter

      - name: Check HTML renderer
        run: npm run check:html-renderer

      - name: Run CLI smoke checks
        run: npm run cli:smoke

      - name: Check playground wiring
        run: npm run playground:check
